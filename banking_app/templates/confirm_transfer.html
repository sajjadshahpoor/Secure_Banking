<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank of Belgium | Confirm Transfer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/transfer.css') }}">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/dashboard">
                <img src="{{ url_for('static', filename='images/logo.png') }}" width="55" class="me-3" alt="Bank Logo">
                <span class="fw-bold fs-3" style="color:#003366">Bank of Belgium</span>
            </a>
        </div>
    </nav>

    <main class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 100px);">
        <div class="register-card card border-0 shadow-lg">
            <div class="card-body p-5">
                <h1 class="text-center mb-3">Confirm Transfer</h1>
                {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}
                <div class="mb-4">
                    <strong>Recipient:</strong> {{ transfer.recipient_name }}<br>
                    <strong>Account:</strong> {{ transfer.recipient_account_number }}<br>
                    <strong>Amount:</strong> €{{ "{:.2f}".format(transfer.amount) }}
                </div>

                <div class="text-center mb-4">
                    <div id="transfer-otp-qr" data-qr-text="{{ otp_value }}" class="d-inline-block p-3 bg-white border rounded"></div>
                </div>

                <form method="POST" action="/transfer/confirm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-4">
                        <label class="form-label">Code</label>
                        <input type="text" name="otp" class="form-control form-control-lg" placeholder="Enter code" required>
                    </div>
                    <button class="btn btn-primary btn-lg w-100">Complete Transfer</button>
                </form>

                <form method="POST" action="/transfer/confirm/regenerate" class="mt-3">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button class="btn btn-outline-secondary w-100">Generate New Code</button>
                </form>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/qrcode.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/qr_code_init.js') }}"></script>

</body>

</html>
