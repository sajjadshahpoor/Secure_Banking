<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Admin Portal</title>
    <link rel="stylesheet" href="/static/css/admin_legacy.css">
</head>

<body>

    <h1>Administration Portal</h1>

    <p>Authorized personnel only.</p>

    {% if error %}
    <p class="admin-error">
        {{ error }}
    </p>
    {% endif %}

    <form method="POST">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Sign In
        </button>

    </form>

</body>

</html>
