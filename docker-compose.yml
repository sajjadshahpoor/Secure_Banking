services:
  app:
    build: .
    volumes:
      - ./instance:/app/instance
    env_file:
      - .env
    restart: unless-stopped
    command: python -m banking_app.app
    expose:
      - "5000"          # only reachable from inside the docker network (nginx), not the host

  nginx:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "443:443"       # the ONLY port published to the host/network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
